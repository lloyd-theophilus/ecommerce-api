version: "3.8"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-api-app
    ports:
      - 5003:3000
    env_file:
      - ./.env

  mongo:
    image: mongo
    container_name: mongo-db
    volumes:
      - ./data:/data/db
    env_file:
      - ./.env
    ports:
      - 27001:27017


volumes:
  data:
